name: BOT-001
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q bot.py tests
      - run: python -m unittest discover -s tests -v
      - name: Проверка первого и повторного воспроизведения
        run: |
          db="$RUNNER_TEMP/bot-replay.sqlite3"
          test "$(python bot.py --db "$db" replay examples/events.jsonl)" = '{"accepted": 2, "processed": 2}'
          test "$(python bot.py --db "$db" replay examples/events.jsonl)" = '{"accepted": 0, "processed": 0}'
